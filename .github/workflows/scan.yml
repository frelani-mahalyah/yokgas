name: Jio Gemini Scanner

on:
  schedule:
    # Jalankan otomatis setiap 20 menit (24 jam)
    - cron: '*/20 * * * *'
  workflow_dispatch:  # Bisa dijalankan manual kapan saja

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scanner
        run: python yokgas.py
        env:
          PYTHONUTF8: "1"

      - name: Save and commit results
        continue-on-error: true
        run: |
          echo "=== Scan at $(date) ===" >> scan_history.txt
          if [ -f gemini_activation_links.txt ]; then
            cat gemini_activation_links.txt >> scan_history.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gemini_activation_links.txt gemini_results.csv scan_history.txt 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Auto scan result $(date '+%Y-%m-%d %H:%M')" && git push) || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
